name: Verify API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voley
          POSTGRES_PASSWORD: voley
          POSTGRES_DB: voley_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voley -d voley_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://voley:voley@localhost:5432/voley_test?schema=public
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      WEB_ORIGIN: http://localhost:3000
      PODIO_CRON_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm test
      - run: npm run build
      - name: API integration tests
        run: |
          node dist/main.js > /tmp/voley-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4000/health; then break; fi
            sleep 1
          done
          npm run test:integration || { cat /tmp/voley-api.log; exit 1; }
