services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voley
      POSTGRES_PASSWORD: voley
      POSTGRES_DB: voley
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voley"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
